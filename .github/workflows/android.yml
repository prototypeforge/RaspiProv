# Builds the Android app (app/) and publishes the debug APK as a workflow
# artifact. On a v* tag the APK is also attached to the GitHub release.
#
# Nothing here affects the Pi-side package or the plain web client.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "web/**"
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write   # only used by the release step on tags

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install JS dependencies
        working-directory: app
        run: npm ci

      - name: Test the BLE client
        working-directory: app
        run: npm test

      - name: Bundle web assets and sync the Android project
        working-directory: app
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk RaspiProv-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RaspiProv-debug-apk
          path: RaspiProv-debug.apk
          if-no-files-found: error

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RaspiProv-debug.apk
